# pattern_cols: 6
# pattern_rows: 9
# square_size_mm: 26.0

# #####-----机械安装先验-----#####
# # R_gimbal2imubody：gimbal 系 -> IMU body 系的旋转，必须按机械安装/CAD 填写。
# R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# #####-----相机-----#####
# camera_name: "hikrobot"
# exposure_ms: 5.0
# gain: 16.0
# vid_pid: "2bdf:0001"

# #####-----CBoard 串口-----#####
# capture_imu: true  # 按 S 同时保存图片和 IMU 四元数，供内参和手眼标定使用
# serial_device: "/dev/ttyACM0"
# serial_baudrate: 115200

# #####-----相机内参-----#####
# camera_matrix: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# distort_coeffs: [0, 0, 0, 0, 0]

# #####-----相机安装外参（手眼/机械测量结果）-----#####
# # R_camera2gimbal：OpenCV 相机系 -> gimbal 系（行优先 9 个数）。
# # t_camera2gimbal：相机光心在 gimbal 系下的平移，单位 m。
# # 机械测量给出 t 的初值；R 以棋盘格手眼结果为准。
# R_camera2gimbal: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# t_camera2gimbal: [0, 0, 0]

pattern_cols: 9
pattern_rows: 6
center_distance_mm: 26

R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

camera_name: "hikrobot"
exposure_ms: 3
gain: 16.0
vid_pid: "2bdf:0001"

#####-----cboard参数-----#####
serial_device: "/dev/ttyACM0"   # 串口设备
serial_baudrate: 115200         # 波特率

# 重投影误差: 0.2884px
camera_matrix: [2244.1813680839482, 0, 761.73000277995345, 0, 2238.7971914956015, 627.65647659996728, 0, 0, 1]
distort_coeffs: [-0.11778666120465334, 0.10509413428255092, 0.0036826019237248763, 0.0032478807137049088, 0]

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

