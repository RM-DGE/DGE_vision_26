# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 1280
image_height: 720
fov_h: 87.7
fov_v: 56.7

# 前向工业相机为 0°；左/右 USB 相机安装角（度，向左为正）
left_camera_yaw_deg: 120
right_camera_yaw_deg: -120
usb_frame_rate: 30
usb_exposure: 200 # 单位约 100us；500 会把实际帧率压到 ~16fps
usb_gamma: 160
usb_gain: 10 #0-96

# 固定设备路径，避免插拔后 /dev/videoN 变化；按实际左右安装交换这两个路径。
usb_left_device: "v4l/by-path/pci-0000:00:14.0-usb-0:2.1:1.0-video-index0"
usb_right_device: "v4l/by-path/pci-0000:00:14.0-usb-0:2.3:1.0-video-index0"

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 0.8
gain: 16.9
vid_pid: "2bdf:0001"

# 图像时间戳相对 IMU 的时间补偿（ms），真机按实际链路延迟调整
imu_delay_ms: 1.0

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25

#####-----4板 rmcs 像素 EKF-----#####
# 真机检测角点噪声通常比仿真小；先用 rmcs 默认 40 px^2，再按 NIS/残差调。
ekf:
  noise_observation: 40.0
  # 过程噪声模型：cwna | dwna | diag_rate
  # cwna: Q_pp=q*dt^3/3, Q_pv=q*dt^2/2, Q_vv=q*dt
  # dwna: sp25 原版，Q_pp=q*dt^4/4, Q_pv=q*dt^3/2, Q_vv=q*dt^2
  # diag_rate: 旧的 diag(noise_*)*dt
  process_model: cwna
  # q_accel_xy / q_accel_z: (m/s²)²·s；q_alpha: (rad/s²)²·s
  q_accel_xy: 1.0
  q_accel_z: 1e-4
  q_alpha: 10.0
  initial_cov_position: 0.04
  initial_cov_z: 0.01
  initial_cov_velocity: 4.0
  initial_cov_vz: 0.01
  initial_cov_angle: 0.1
  initial_cov_rotation_speed: 4.0
  initial_cov_radius: 0.001
  initial_cov_height: 0.001
  anchor_max_corner_error: 40.0
  anchor_max_relative_error: 0.5
  auto_reinit_after_no_update: 10
  max_no_update_frames: 30
  converge_max_cov_xy: 0.04
  converge_max_cov_v: 1.0
  converge_max_cov_w: 1.0
  converge_max_no_update_frames: 5
  rotation_speed_limit: 25.132741228718345
  # 监控用：chi-square(4) 95%
  nis_threshold: 9.488
  nis_window: 100
  # 门控用：chi-square(4) 99%，只拒绝明显离群的新息；前 10 帧不门控
  nis_gate_enabled: true
  nis_gate_threshold: 13.277
  nis_gate_warmup_updates: 10
  nis_max_consecutive_rejects: 5
  nis_reject_cov_inflation: 0.01

  # v0.32 观测侧（可 A/B 回退）
  init_prefer_solver_pose: true   # 初始化优先用 Solver 世界系板位姿；false = 优先 RobustPnp
  skip_tracking_pnp: false        # true: 跟踪阶段 4 板目标跳过逐板 PnP（省 CPU，Foxglove detections 方块失去位姿）

#####-----aimer参数-----#####
yaw_offset: -0.8 # degree -2.5
pitch_offset: -1  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.026 # s
low_speed_delay_time: 0.010 # s

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1833px
camera_matrix: [2414.9359264386621, 0, 717.26243105567414, 0, 2418.0489262208148, 582.68540529942845, 0, 0, 1]
distort_coeffs: [-0.0209453389287673, 0.15028138841073832, -0.0006517722113234505, -0.0016861906197686788, 0]

# 相机同理想情况的偏角: yaw-1.11 pitch0.01 roll-0.06 degree
# 标定板到世界坐标系原点的水平距离: 1.20 m
# 标定板同竖直摆放时的偏角: yaw123.89 pitch14.05 roll-0.86 degree
R_camera2gimbal: [0.01928451708725664, 0.00012696140743255463, 0.99981402834802846, -0.99981344688553653, -0.0010834913551969569, 0.019284643459122196, 0.0010857382619952124, -0.99999940496346484, 0.00010604311483339372]
t_camera2gimbal: [0.13089617453251859, 0.0038468007459533785, 0.094139945222010288]

#####-----cboard串口参数-----#####
serial_device: "/dev/ttyACM0"
serial_baudrate: 115200

#####-----ROS2 导航通信-----#####
# 串口仍由 CBoard 独占；本节点只把解析后的 IMU/状态发布到 ROS，
# 并订阅导航发来的无敌目标/优先目标。默认不把云台指令绕到 ROS，
# 避免给云台控制增加一次 DDS 往返。
ros2:
  enabled: true
  node_name: "dge_mcu_bridge"
  imu_topic: "/mcu/imu"
  status_topic: "/mcu/status"
  # 可选：自瞄 -> /gimbal/cmd -> 桥接层 -> 串口。
  # 生产默认 false，保持 sentry_DGE 直接 cboard.send() 的低延时路径。
  enable_remote_gimbal_cmd: false
  gimbal_cmd_topic: "/gimbal/cmd"
  nav_enemy_status_topic: "/enemy_status"
  nav_autoaim_target_topic: "/autoaim_target"
  target_pos_topic: "/auto_aim_target_pos"
  target_info_topic: "/auto_aim_target_info"
  imu_frame_id: "imu_link"
  # IMU 原始帧 1 kHz；导航不需要全量，默认降采样到 200 Hz。
  # 测试时可在临时配置里改成 1000，测原始链路。
  imu_publish_rate: 200.0
  status_publish_rate: 20.0
  max_cmd_age_ms: 20.0
  nav_timeout_ms: 1500.0
  status_online_timeout_ms: 200.0
