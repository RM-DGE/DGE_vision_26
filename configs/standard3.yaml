# bullet_speed_canid: 0x101
# send_canid: 0xff
# can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
# fire_thresh: 0.0035
fire_thresh: 0.0001

max_yaw_acc: 10
Q_yaw: [9e5, 0]
R_yaw: [3]

max_pitch_acc: 50
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s