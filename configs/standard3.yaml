# Linux 接usb转ttl 设备名 ttyUSB0
# 接cboard虚拟串口 设备名 ttyACM0
#####-----cboard参数-----#####  
serial_device: "/dev/ttyACM0"   # 串口设备
serial_baudrate: 115200         # 波特率

# sudo chmod 777 /dev/ttyACM0
# cmake -B build
# make -C build

# #####-----cboard参数-----#####
# quaternion_canid: 0x100
# bullet_speed_canid: 0x101
# send_canid: 0xff
# can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
# fire_thresh: 0.0035
fire_thresh: 0.0001

max_yaw_acc: 10
Q_yaw: [9e5, 0]
R_yaw: [3]

max_pitch_acc: 50
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

#####-----V0.60 恢复管理器-----#####
recovery:
  trigger_s: 0.04
  window_s: 0.12
  sample_s: 0.015
  expiry_s: 0.15
  confirm_s: 0.02
  coast_s: 0.15
  lost_s: 0.5
  max_rms_px: 5.0
  improvement_ratio: 0.7
  identity_distance_m: 0.8
  future_position_variance: 0.04
  covariance_inflation: 2.0
  max_fit_ms: 20.0
  min_frames: 3
  max_frames: 8
  max_seeds: 4
  iterations: 8
